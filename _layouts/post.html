---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="date">Published on {{ page.date | date: "%B %-d, %Y" }}</div>

  <div class="entry">
    {{ content }}
  </div>
</article>

{% if page.tags contains "agent-playbook" %}
  <script src="{{ '/assets/prompt-copy.js' | relative_url }}" defer></script>
{% endif %}
