<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {%- include head.html -%}

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="site-shell site-nav">
        <a class="site-brand" href="{{ "/" | relative_url }}">
          <span class="site-brand__name">{{ site.title }}</span>
          <span class="site-brand__meta">AI, investing, cooking, football, books</span>
        </a>

        <nav class="site-menu" aria-label="Primary navigation">
          <a href="{{ "/" | relative_url }}">Home</a>
          <a href="{{ "/ai/llm-inference-engineering/" | relative_url }}">AI Course</a>
          <a href="{{ "/investment/" | relative_url }}">Investment</a>
          <a href="{{ "/interested/" | relative_url }}">Interested</a>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode" data-theme-toggle>
            <span data-theme-toggle-text>Theme</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main-content" class="page-content">
      <div class="site-shell content-shell{% if page.course %} content-shell--course{% endif %}">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="site-shell footer-inner">
        <p>{{ site.description }}</p>
      </div>
    </footer>

    <script>
      (function () {
        var toggle = document.querySelector("[data-theme-toggle]");
        var label = document.querySelector("[data-theme-toggle-text]");

        function setTheme(theme) {
          document.documentElement.dataset.theme = theme;
          localStorage.setItem("theme", theme);
          if (label) label.textContent = theme === "dark" ? "Light" : "Dark";
        }

        setTheme(document.documentElement.dataset.theme || "light");

        if (toggle) {
          toggle.addEventListener("click", function () {
            var nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            setTheme(nextTheme);
          });
        }
      })();
    </script>
  </body>
</html>
